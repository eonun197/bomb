 name: Daily Counter Reset                                                     
  on:
    schedule:                                                                   
      - cron: '0 15 * * *'                                  
    workflow_dispatch:                                                          
  jobs:                                                     
    reset:
      runs-on: ubuntu-latest
      steps:                                                                    
        - name: Reset all bomb counters
          env:                                                                  
            ABACUS_KEY_SCHOOL:  ${{ secrets.ABACUS_KEY_SCHOOL }}
            ABACUS_KEY_COMPANY: ${{ secrets.ABACUS_KEY_COMPANY }}               
            ABACUS_KEY_EXAM:    ${{ secrets.ABACUS_KEY_EXAM }}                  
            ABACUS_KEY_MONDAY:  ${{ secrets.ABACUS_KEY_MONDAY }}                
          run: |                                                                
            for KEY in school company exam monday; do                           
              VAR="ABACUS_KEY_$(echo $KEY | tr a-z A-Z)"                        
              curl -fsS -X POST -H "Authorization: Bearer ${!VAR}" \            
                "https://abacus.jasoncameron.dev/reset/eonun197-bomb-hits/$KEY" 
              echo " ← $KEY reset"                                              
            done
